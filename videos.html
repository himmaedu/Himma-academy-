<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفيديوهات - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light;
--c1:#0a7ba0;--c2:#0f9bbd;--gold1:#ffc233;--gold2:#ff9f1c;--goldink:#4a3000;--cglow:rgba(6,120,150,.38);--cdeep:#086a8c}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,280px));justify-content:center;gap:18px;margin-top:28px}
.vcard{direction:rtl;text-align:center;padding:20px 18px 22px;border-radius:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 14px 32px var(--cglow);transition:transform .25s}
.vcard:hover{transform:translateY(-4px)}
.vcard::before{content:"";position:absolute;left:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.vcard>*{position:relative}
.vtag{display:inline-block;max-width:100%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--goldink);padding:6px 14px;border-radius:999px;font-weight:800;font-size:13.5px;line-height:1.5;box-shadow:0 6px 14px rgba(255,159,28,.4)}
.vico{width:68px;height:68px;margin:14px auto 6px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.vico svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vword{font-size:32px;font-weight:800;line-height:1.2;text-shadow:0 2px 4px rgba(0,60,80,.2)}
.vcard p{color:#fff;font-size:13.5px;line-height:1.6;margin:6px 0 14px;font-weight:500;text-shadow:0 1px 2px rgba(0,60,80,.25)}
.vgo{display:inline-block;width:auto;margin:0;padding:9px 24px;border:0;border-radius:999px;background:#fff;color:var(--cdeep);font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(0,60,80,.2)}
.vgo:hover{background:#e8fbff}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:24px;margin:34px auto 0;max-width:420px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:10px;border-radius:6px;background:var(--line);margin-bottom:12px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mock .g div{height:110px;border-radius:12px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.vcard{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1 id="ttl">الرياضيات</h1>
  <p class="sub" id="br">فيديوهات مادة الرياضيات</p>

  <div class="vgrid">
    <article class="vcard">
      <span class="vtag">👨‍🏫 الأستاذ نور الدين (الدرس)</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7C13 5 9 4.5 5 5V24C9 23.5 13 24 16 26"/><path d="M16 7C19 5 23 4.5 27 5V24C23 23.5 19 24 16 26"/><path d="M16 7V26"/></svg></div>
      <div class="vword">الدرس</div>
      <p id="p1">شرح الدرس بالفيديو</p>
      <button class="vgo" type="button" data-n="الدرس">شاهد الآن ←</button>
    </article>

    <article class="vcard">
      <span class="vtag">👨‍🏫 الأستاذ نور الدين (الميزان)</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5V26M10 26H22M6 10H26"/><path stroke-width="1.8" d="M8 10L5 18M8 10L11 18M24 10L21 18M24 10L27 18"/><path stroke-width="1.8" d="M4 18A4 4 0 0 0 12 18ZM20 18A4 4 0 0 0 28 18Z"/><circle cx="16" cy="5" r="1.4" fill="#fff" stroke="none"/></svg></div>
      <div class="vword">الميزان</div>
      <p id="p2">حل سلاسل الميزان بالفيديو</p>
      <button class="vgo" type="button" data-n="الميزان">شاهد الآن ←</button>
    </article>
  </div>

  <div class="bar">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const ch=localStorage.getItem('mishkat_chapter')||'';
const br=localStorage.getItem('mishkat_branch')||'';
const title=ch||'الرياضيات';
document.getElementById('ttl').textContent=title;
document.title=title+' - أكاديمية مشكاة';
let sub='فيديوهات مادة الرياضيات';
if(br) sub+=' • شعبة '+br;
document.getElementById('br').textContent=sub;
if(ch){
  document.getElementById('p1').textContent='شرح درس «'+ch+'» بالفيديو';
  document.getElementById('p2').textContent='حل سلاسل الميزان لدرس «'+ch+'» بالفيديو';
}

const toast=document.getElementById('toast');
let tm;
document.querySelectorAll('.vgo').forEach(b=>{
  b.onclick=()=>{
    toast.textContent='فيديوهات «'+b.dataset.n+'» للأستاذ نور الدين قيد الإعداد، وستُضاف قريباً ✨';
    toast.classList.add('on');
    clearTimeout(tm);
    tm=setTimeout(()=>toast.classList.remove('on'),2800);
  };
});
</script>
<script src="about.js"></script>
</body>
</html>
